<!doctype html><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: data:; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'"><title>Sonify native Web Audio verification</title>
<style>body{font:16px system-ui;padding:28px;background:#faf9f6;color:#223}pre{white-space:pre-wrap}a,button{margin:8px;display:inline-block}</style>
<h1>原生 Web Audio 离线渲染检查</h1><p>这是接口和波形检查；不等于真人音色评价。</p><pre id="result">Running…</pre><div id="files"></div><button id="live">测试实时播放、暂停、续播、停止</button><pre id="liveResult"></pre>
<script src="../04-instrument-samples.js"></script><script src="../classical.js"></script><script src="../samples.js"></script><script src="../music.js"></script>
<script>
const input=[{id:'roof',points:[{x:.1,y:.7},{x:.5,y:.2},{x:.9,y:.7}]},{id:'window',points:[{x:.3,y:.5},{x:.7,y:.5},{x:.7,y:.8},{x:.3,y:.8},{x:.3,y:.5}]}];
const report={userAgent:navigator.userAgent,status:'running',results:[],startedAt:new Date().toISOString()};
const reportView=document.getElementById('result');
function show(){reportView.textContent=JSON.stringify(report,null,2)}
function measure(bytes){const view=new DataView(bytes.buffer);const length=(bytes.length-44)/4;let peak=0,sum=0,tailPeak=0;for(let i=0;i<length;i++)for(let c=0;c<2;c++){const value=view.getInt16(44+i*4+c*2,true)/32768;peak=Math.max(peak,Math.abs(value));sum+=value*value;if(i>length-4410)tailPeak=Math.max(tailPeak,Math.abs(value))}return{bytes:bytes.length,seconds:length/44100,peak,rms:Math.sqrt(sum/(length*2)),tail100msPeak:tailPeak}}
(async()=>{try{for(const style of ['piano','eastern','ambient']){const score=SonifyMusic.compose(input,{style,bars:8,bpm:84});const then=performance.now();const wav=await SonifyMusic.renderWav(score,{volume:.65});const metrics=measure(new Uint8Array(await wav.arrayBuffer()));const status=SonifyMusic.getAudioStatus();const result={style,renderMs:Math.round(performance.now()-then),...metrics,samples:status,soloTracks:{},passed:status.fallbackNotes===0&&metrics.rms>.003&&metrics.peak<=.961&&metrics.tail100msPeak<.001};report.results.push(result);show();for(const track of ['melody','harmony','bass']){const solo=await SonifyMusic.renderWav(score,{volume:.65,muted:score.tracks.map(t=>t.id).filter(id=>id!==track)});result.soloTracks[track]=measure(new Uint8Array(await solo.arrayBuffer()));show()}const a=document.createElement('a');a.href=URL.createObjectURL(wav);a.download='sonify-native-'+style+'.wav';a.textContent='下载 '+style+' WAV';document.getElementById('files').append(a);show()}report.instruments=[];for(const instrument of ['violin','cello','flute','koto','shakuhachi','guitar','harp','epiano','clarinet','vibes','marimba','bass']){const score=SonifyMusic.compose(input,{bars:2,bpm:132,instrument,scaleMode:'minor'});const wav=await SonifyMusic.renderWav(score);const metrics=measure(new Uint8Array(await wav.arrayBuffer()));report.instruments.push({instrument,...metrics,samples:SonifyMusic.getAudioStatus()});show()}const extreme=SonifyMusic.compose(input,{style:'piano',bars:8,density:1,reverb:1,brightness:1});const extremeWav=await SonifyMusic.renderWav(extreme,{volume:1});report.extreme=measure(new Uint8Array(await extremeWav.arrayBuffer()));report.status=report.results.every(r=>r.passed)&&report.instruments.every(r=>r.rms>.003&&r.samples.fallbackNotes===0)&&report.extreme.peak<=.961?'passed':'failed';report.finishedAt=new Date().toISOString();show();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'}));a.download='musicpaint-native-audio.json';a.textContent='下载验证记录';document.getElementById('files').append(a)}catch(error){report.status='error';report.error=error.stack;show()}})();
document.getElementById('live').onclick=async()=>{const out=document.getElementById('liveResult');const player=SonifyMusic.createPlayer();try{const score=SonifyMusic.compose(input,{bars:4});await player.play(score,{volume:.08,offsetBeat:4});await new Promise(r=>setTimeout(r,250));const before=player.getBeat();const paused=player.pause();await new Promise(r=>setTimeout(r,100));const held=player.getBeat();await player.play(score,{volume:.08,offsetBeat:paused});await new Promise(r=>setTimeout(r,150));const resumed=player.getBeat();player.setMuted(['melody','harmony']);player.stop();const stopped=player.getBeat();await player.dispose();out.textContent=JSON.stringify({status:before>4&&paused===held&&resumed>paused&&stopped===0?'passed':'failed',before,paused,held,resumed,stopped},null,2)}catch(e){out.textContent=e.stack;await player.dispose()}};
</script>
