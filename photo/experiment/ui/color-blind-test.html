<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sonify · 色彩音乐盲听</title><style>body{max-width:900px;margin:25px auto;padding:20px;background:#102521;color:#eee6ce;font:15px/1.7 system-ui}img{display:block;max-width:100%;height:35vh;object-fit:contain;margin:auto}.versions{display:grid;grid-template-columns:1fr 1fr;gap:15px}article{background:#1a3530;border-radius:12px;padding:18px}audio{width:100%}label{display:block;margin:12px 0}select,button{padding:9px;background:#dac58b;color:#17352c;border:0;border-radius:5px}button{margin:8px}p,small{color:#b8c6b7}@media(max-width:650px){.versions{grid-template-columns:1fr}}</style><h1>哪段音乐更贴合这张图的色彩？</h1><p>两个版本播放顺序随机，音频 RMS 已统一。请分别完整试听，按自己的感受评分。所有记录只保存在本浏览器，可导出；不收集姓名，不上传服务器。</p><p id="progress"></p><img id="photo" alt="本轮图片"><div class="versions" id="versions"></div><label>更贴合图片色彩的是：<select id="choice"><option value="">请选择</option><option>A</option><option>B</option></select></label><button id="save">记录并进入下一张</button><button id="next-person" hidden>下一位听众</button><button id="export">导出全部记录</button><p id="message" role="status"></p><script src="color-blind-test.js"></script></html>
