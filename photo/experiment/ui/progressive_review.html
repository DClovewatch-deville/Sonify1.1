<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Progressive 音乐前后对比</title><style>[hidden]{display:none!important}body{background:#0b1d18;color:#e7dec2;font:15px/1.6 Segoe UI,Microsoft YaHei;margin:24px}main{max-width:1100px;margin:auto}button,a{padding:10px 16px;background:#d9c78b;color:#173b30;border:0;border-radius:6px;margin:5px;display:inline-block}canvas{display:block;height:65vh;max-width:100%;margin:14px auto;background:#081715}audio{display:block;width:100%}video{display:block;width:100%;height:280px;background:#081715;margin-top:12px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:24px}p{color:#b5c5b5}#status{color:#f4d480}</style><main><h1>同一张图 · 音乐前后对比</h1><p>同为36秒，保留相同的四阶段几何揭示；新版在33–34秒恢复真实彩色原图。两份试听按整体 RMS 近似匹配，供人工比较音乐走向。</p><div class="compare"><section><h2>修改前</h2><audio controls src="progressive-review/sample5-before-listen.wav"></audio><a download href="progressive-review/sample5-before-listen.wav">下载修改前音频</a><a id="before-video" hidden>下载修改前视频</a><video controls preload="metadata" src="progressive-review/sonify-progressive-before.webm"></video></section><section><h2>修改后 · 东方自然</h2><audio controls src="progressive-review/sample5-after-listen.wav"></audio><a download href="progressive-review/sample5-after-listen.wav">下载修改后音频</a><a id="after-video" hidden>下载修改后视频</a><video controls preload="metadata" src="progressive-review/sonify-progressive-after.webm"></video></section></div><button id="record">生成两份对比视频（约72秒）</button><p id="status" role="status">待生成 · 浏览器直接录制真实画布与对比音轨</p><canvas id="picture" width="720" height="840"></canvas></main><script>
const $=s=>document.querySelector(s),canvas=$('#picture'),c=canvas.getContext('2d');let data,plan,photo;
const ready=Promise.all([fetch('studio/sample5.json?v=27').then(r=>r.json()),fetch('progressive-review/sample5-plan.json?v=27').then(r=>r.json())]).then(async values=>{[data,plan]=values;photo=new Image();photo.src='studio/sample5-original.jpg';await photo.decode();});
function part(pts,f){if(f>=1)return pts;const lengths=pts.slice(1).map((q,i)=>Math.hypot(q[0]-pts[i][0],q[1]-pts[i][1]));let remain=lengths.reduce((a,b)=>a+b,0)*f,out=[pts[0]];for(let i=0;i<lengths.length;i++){if(remain>=lengths[i]){out.push(pts[i+1]);remain-=lengths[i];}else{let u=remain/(lengths[i]||1);out.push([pts[i][0]+(pts[i+1][0]-pts[i][0])*u,pts[i][1]+(pts[i+1][1]-pts[i][1])*u]);break;}}return out;}
const ink=['#e8c883','#8fc4bc','#a8bc90','#c5b6d1'];
function painter(ctx,row,t){const progress=Math.min(1,(t-row.start)/(row.end-row.start)),pts=part(row.points,progress);if(pts.length<2)return;const active=t<row.end;ctx.strokeStyle=active?'#fff1bf':ink[row.revealStage];ctx.lineWidth=active?2.1:1.15;ctx.globalAlpha=active?1:.88;ctx.lineJoin='round';ctx.lineCap='round';ctx.shadowColor=ink[row.revealStage];ctx.shadowBlur=active?9:0;ctx.beginPath();pts.forEach((q,i)=>i?ctx.lineTo(fit.x+q[0]*fit.w,fit.y+q[1]*fit.h):ctx.moveTo(fit.x+q[0]*fit.w,fit.y+q[1]*fit.h));ctx.stroke();ctx.globalAlpha=1;ctx.shadowBlur=0;}
let fit,cache,cachectx,sorted,done;
function initialise(){let w=800,h=w*data.height/data.width;if(h>940){h=940;w=h*data.width/data.height;}fit={x:(900-w)/2,y:(1050-h)/2,w,h};cache=document.createElement('canvas');cache.width=900;cache.height=1050;cachectx=cache.getContext('2d');done=0;sorted=plan.entries.slice().sort((a,b)=>a.end-b.end);}
function draw(t,version){c.setTransform(.8,0,0,.8,0,0);c.fillStyle='#081715';c.fillRect(0,0,900,1050);let g=c.createRadialGradient(450,525,20,450,525,540);g.addColorStop(0,'#20352b');g.addColorStop(1,'#081715');if(t>0){c.fillStyle=g;c.fillRect(0,0,900,1050);}while(done<sorted.length&&sorted[done].end<=t){painter(cachectx,sorted[done],sorted[done].end);done++;}c.drawImage(cache,0,0);for(const row of plan.entries){if(row.start>t)break;if(row.end>t)painter(c,row,t);}if(version==='after'&&t>33){c.globalAlpha=Math.min(1,t-33);c.drawImage(photo,fit.x,fit.y,fit.w,fit.h);c.globalAlpha=1;}c.textAlign='center';c.fillStyle='#e5d7a5';c.font='16px Georgia';if(t>=30)c.fillText('FROM GEOMETRY → MUSIC',450,1028);c.textAlign='left';}
async function record(version){await ready;initialise();const ac=new AudioContext();await ac.resume();const bytes=await fetch(`progressive-review/sample5-${version}-listen.wav`).then(r=>r.arrayBuffer()),buffer=await ac.decodeAudioData(bytes);const src=ac.createBufferSource();src.buffer=buffer;const dest=ac.createMediaStreamDestination();src.connect(dest);src.connect(ac.destination);draw(0,version);const stream=canvas.captureStream(20);dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));const mime=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));const recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:3500000});const chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};const result=new Promise(resolve=>recorder.onstop=()=>{const link=$(`#${version}-video`);link.href=URL.createObjectURL(new Blob(chunks,{type:mime}));link.download=`sonify-progressive-${version}.webm`;link.hidden=false;stream.getTracks().forEach(t=>t.stop());ac.close();resolve();});recorder.start(1000);const start=ac.currentTime+.1;src.start(start);let recording=true;const frame=()=>{if(!recording)return;let t=Math.max(0,Math.min(36,ac.currentTime-start));draw(t,version);$('#status').textContent=`${version==='before'?'修改前':'修改后'}视频生成中 · ${t.toFixed(1)} / 36秒`;if(t<36)requestAnimationFrame(frame);};frame();src.onended=()=>{recording=false;draw(36,version);if(recorder.state!=='inactive')recorder.stop();};await result;}
for(const version of ['before','after'])fetch(`progressive-review/sonify-progressive-${version}.webm`,{method:'HEAD'}).then(r=>{if(r.ok){const link=$(`#${version}-video`);link.href=`progressive-review/sonify-progressive-${version}.webm`;link.download=`sonify-progressive-${version}.webm`;link.hidden=false;}});
$('#record').onclick=async()=>{document.querySelectorAll('audio').forEach(a=>a.pause());$('#record').disabled=true;try{await record('before');await record('after');$('#status').textContent='两份视频已生成，可下载并人工试听验收。';}catch(e){$('#status').textContent='录制失败：'+e.message;}finally{$('#record').disabled=false;}};
</script></html>
