<!doctype html><html lang="zh"><meta charset="utf-8"><title>Sonify · 跨图像与风格试听</title><style>body{background:#0b201c;color:#e5debb;font:15px system-ui;max-width:1100px;margin:40px auto;padding:20px}a{color:#e5ca83}h1{font:32px Georgia}#rows{display:grid;grid-template-columns:1fr 1fr;gap:24px}article{padding:20px;background:#17322c;border-radius:12px}img{width:100%;height:220px;object-fit:contain;background:#eee9db}audio{width:100%;height:34px}small{display:block;color:#a9bab1;margin:8px 0}label{display:block;margin-top:16px}code{font-size:11px} @media(max-width:700px){#rows{grid-template-columns:1fr}}</style><a href="studio.html">← 回到展演</a><h1>同一套语法，四种视觉组织，四种音乐表达</h1><p>逐项比较主题轮廓、节奏与伴奏。所有版本确定性生成；现代结构和自然景物为边缘提取测试，尚未加入主作品库。</p><div id="rows"></div><script>fetch('progressive-diversity/manifest.json').then(r=>r.json()).then(rows=>{document.querySelector('#rows').innerHTML=rows.map(r=>`<article><h2>${r.name}</h2><img src="${r.image}"><small>${r.method}</small>${Object.entries(r.styles).map(([k,s])=>`<label>${{nature:'东方自然',chamber:'西洋小型交响',piano:'独奏钢琴',strings:'弦乐叙事'}[k]}<small>主题 MIDI：${s.theme.join(' · ')}<br>组织：${s.dna.profile} · 呼应脉冲：${s.dna.pulse.join(' / ')}</small><audio controls preload="none" src="${s.audio}"></audio></label>`).join('')}</article>`).join('');document.addEventListener('play',e=>{for(const a of document.querySelectorAll('audio'))if(a!==e.target)a.pause()},true)});</script></html><section id="color-ab"><h2>Color DNA · 同图、同曲风 A/B</h2><p>固定同一组亭子几何与东方自然曲风，仅替换色彩输入；用于隔离验证色彩表达，不代表这些测试照片的几何。灰白线稿应保持不变。</p><div id="color-ab-rows"></div></section><script>fetch('color-checks/report.json').then(r=>r.json()).then(rows=>{document.querySelector('#color-ab-rows').innerHTML=rows.map(r=>`<article><h3>${{autumn:'混合秋景',blue:'蓝紫建筑',green:'绿色山水',gray:'黑白线稿',gold:'金色建筑'}[r.case]}</h3><small>冷暖 ${r.dna.warmth} · 明暗 ${r.dna.luminance} · 饱和度 ${r.dna.saturation} · 对比度 ${r.dna.contrast}${r.dna.available?'':' · 色彩不足，跳过映射'}</small>${Object.entries(r.variants).map(([k,v])=>`<label>${k==='off'?'A · 纯几何':'B · 加入色彩表达'}<audio controls preload="none" src="${v.audio}"></audio></label>`).join('')}</article>`).join('')});</script>
