<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sonify · 豆包批量生成</title><link rel="stylesheet" href="/style.css"><style>main{max-width:1050px}h1{font-size:30px;font-weight:500}.cloud-card{background:#fffefa;border:1px solid #dfe2d8;border-radius:14px;padding:22px;margin:18px 0}.batch-row{display:grid;grid-template-columns:110px 1fr 160px;gap:16px;align-items:center;border-top:1px solid #e0e4d8;padding:15px 0}.batch-row img{width:110px;height:120px;object-fit:contain}.batch-row p{font-size:12px}.batch-row button{padding:9px;font-size:12px}.batch-preview{display:flex;gap:8px;flex-wrap:wrap}.batch-preview img{height:120px;width:110px;object-fit:contain}#cloud-alert{color:#9b5630}@media(max-width:600px){.batch-row{grid-template-columns:80px 1fr}.batch-row img{width:80px}.batch-row>div:last-child{grid-column:2}}</style><header><a class="brand" href="/">SONIFY</a><a href="/host">现场接待</a></header><main><p class="eyebrow">SEEDREAM · PARALLEL IMAGE JOBS</p><h1>多张照片，各自成为作品。</h1><p class="hint">最多5张独立图片并行生成线稿；音乐依次渲染。每张分别发起云端请求，会使用你的方舟额度。</p><section class="cloud-card"><p id="cloud-alert" role="status">正在检查云端配置…</p><input id="files" type="file" accept="image/png,image/jpeg" multiple><div id="previews" class="batch-preview"></div><button id="submit" disabled>开始豆包生成</button><p class="hint">原图、云端线稿、内部结构图分别保存。仅展示真实阶段，不承诺固定完成时间。</p></section><section id="jobs" class="cloud-card"></section></main><script src="/cloud-batch.js"></script></html>
