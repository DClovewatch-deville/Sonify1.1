<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sonify · 图片成为音乐</title><link rel="stylesheet" href="/experience.css?v=fit37"></head><body>
<header><a class="brand" href="/">SONIFY <span>← 返回首页</span></a><div><button id="library-toggle" aria-expanded="true">作品列表</button><a href="/host">手机扫码上传 ↗</a></div></header>
<main><aside id="library"><div class="library-top"><h2>你的作品</h2><span id="total">0</span></div><section class="upload"><label for="upload">选择图片 · 可多选最多5张<input id="upload" type="file" accept="image/jpeg,image/png" multiple></label><select id="engine" aria-label="生成方式"><option value="supplied">本地精细线稿 · 免费离线</option><option value="local">快速结构提取 · 免费离线</option><option value="seedream">豆包线稿 · 云端生成</option><option value="comfy" disabled>AI结构提纯 · 专用工作台</option></select><button id="generate" disabled>开始生成</button><p id="upload-note">本地生成完全免费离线，云端生成需服务配置。</p></section><p id="connection" role="status">正在读取作品…</p><div id="items"></div></aside>
<section id="viewer"><div class="viewer-top"><div><small id="eyebrow">FROM IMAGE TO MUSIC</small><h1 id="heading">每一幅图像，都有自己的声音。</h1></div><button id="exhibit-fullscreen">全屏展示</button><button id="replay" hidden>重看生成旅程</button></div><div id="waiting"><div class="empty-symbol">∿</div><p id="waiting-title">上传你的图片，或从左侧选择一份作品。</p><div id="waiting-images"></div><p id="waiting-state" role="status"></p><button id="resume-poll" hidden>重新连接任务</button><button id="fallback-local" hidden>云端未返回线稿，尝试本地快速出稿</button><button id="retry" hidden>重新生成</button></div>
<div id="frame-host" hidden></div><nav id="mode-nav" aria-label="观看模式" hidden><button data-mode="blueprint">01 蓝图谱</button><button data-mode="soul">02 灵魂交响</button><button data-mode="progressive">03 渐显乐章</button></nav><p id="view-note">选中一张图片后，在这里观看它成为音乐。新上传不会切换当前作品。</p></section></main><script src="/experience-lineart-bridge.js?v=1"></script><script src="/experience.js?v=fit37"></script></body></html>
