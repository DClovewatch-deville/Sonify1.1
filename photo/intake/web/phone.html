<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Sonify · 上传你的照片</title><link rel="stylesheet" href="/style.css"></head><body class="phone-page"><header><a class="brand" href="/upload">SONIFY</a><span class="badge">你的照片，你的音乐</span></header><main><p class="eyebrow">EVERYTHING HAS A SOUND</p><h1>让这一刻，<br>成为一段音乐。</h1><p class="phone-lead">选择一张照片，由豆包生成线稿，再在现场听见它的声音。</p><section class="phone-card"><label class="drop" for="phone-file"><span class="plus">＋</span><strong>从相册选择照片</strong><span>建筑、山水、绘画都可以</span><input id="phone-file" type="file" accept="image/*"></label><img id="phone-preview" alt="已选择的照片" hidden><p id="phone-name" class="hint"></p><button id="send" disabled>上传并生成作品 ↗</button><p class="hint">图片会传到现场电脑，用于本次生成和展示。请勿上传敏感或不希望公开展示的照片。</p><p id="phone-error" role="alert" hidden></p></section><section id="receipt" class="phone-card" hidden><p class="eyebrow">YOUR PHOTO IS HERE</p><h2>已收到你的照片</h2><p>请向现场工作人员出示编号</p><strong id="ticket"></strong><p id="phone-state" role="status" aria-live="polite"></p><p class="hint">作品由工作人员在电脑上打开。你可以留在这里查看状态，刷新页面也能找回本次上传。</p><button id="fallback-local" class="secondary" hidden>豆包未返回线稿，尝试 OpenCV 快速出稿</button><button id="another" class="secondary" hidden>再选一张图片</button></section><p style="text-align:center;margin:28px 0"><a href="/community">进入社区 · 发布作品 / 试听 / 点赞 ↗</a></p></main><script src="/phone.js"></script></body></html>
