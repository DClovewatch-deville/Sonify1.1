<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sonify · 图片的生成旅程</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f5ef;color:#294337;font:14px/1.8 'Microsoft YaHei',sans-serif}header{display:flex;justify-content:space-between;padding:16px 28px;border-bottom:1px solid #dfe3d6}a{color:#42654d}main{max-width:1120px;margin:auto;padding:18px 24px}h1{font-size:24px;font-weight:500;margin:5px 0}p{color:#7a8876;margin:5px 0}#scene{position:relative;height:min(62vh,570px);background:#fffefa;border-radius:16px;border:1px solid #dfe3d6;margin:15px 0;overflow:hidden}#photo,#line,#drawing{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:20px}#line{opacity:0}#drawing{padding:0}nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,.enter{border:0;border-radius:8px;background:#375b46;color:white;padding:12px 20px;font-size:13px;text-decoration:none;cursor:pointer}button.secondary{background:#e5ebdd;color:#375b46}button:disabled{opacity:.5}small{color:#87927e}progress{width:100%;height:4px;accent-color:#5d8055}#phases{display:flex;gap:16px;font-size:11px;color:#8a9482;flex-wrap:wrap}#phases .active{color:#375b46;font-weight:bold}#details{min-height:28px;font-size:12px}#error{color:#9e4b2b}[hidden]{display:none!important}@media(max-width:600px){header{padding:15px}main{padding:15px}h1{font-size:21px}#scene{height:50vh}}
#source-note{font-size:11px;color:#7c8c76;margin:6px 0}
body.portrait #scene{height:calc(100vh - 200px);min-height:420px;width:min(100%,calc(max(420px,100vh - 200px)*var(--image-ratio) + 24px));margin:12px auto}
body.portrait #photo,body.portrait #line{padding:12px}
</style><header><span>SONIFY · 生成旅程预览</span><a href="/host">返回接待台</a></header><main><div id="phases"><span>01 原图</span><span>02 褪色</span><span>03 描线</span><span>04 几何</span><span>05 音乐种子</span><span>06 进入作品</span></div><h1 id="title">正在读取这张图片的真实产物…</h1><p id="caption">这是已生成结果的解释动画，不代表模型正在推理。</p><div id="scene"><img id="photo" alt="本次上传的原图"><img id="line" alt="本次图片的本地边缘图"><canvas id="drawing"></canvas></div><p id="source-note"></p><progress id="progress" max="1" value="0"></progress><p id="details"></p><p id="error" role="alert"></p><nav><button id="start" disabled>观看生成旅程 · 约 20 秒</button><button id="pause" class="secondary" disabled>暂停</button><button id="skip" class="secondary" disabled>跳过动画</button><a id="enter" class="enter" hidden>进入三个观看模式 ↗</a></nav><small>按真实路径描绘；长路径优先是几何启发式，不等同于屋顶或物体语义识别。音乐种子试听来自实际声部分轨。</small></main><script src="/journey.js"></script></html>
